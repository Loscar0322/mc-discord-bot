# 只跑 Discord 機器人（給 mc-bot 免費 VM 用）
# 用法：在 VM 上把這個檔案命名為 docker-compose.yml，和 bot.py、.env 放在同一個資料夾，然後 docker compose up -d
# .env 只需要 DISCORD_BOT_TOKEN、DISCORD_CHANNEL_ID、SERVER_ADDRESS（Minecraft VM 的固定 IP:25565）
services:
  bot:
    image: python:3.12-slim
    command: sh -c "pip install --no-cache-dir -q discord.py mcstatus && exec python -u /app/bot.py"
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      SERVER_ADDRESS: ${SERVER_ADDRESS}   # 顯示給朋友的位址，機器人也直接查這個位址
      STATUS_CHANNEL_ID: ${STATUS_CHANNEL_ID:-}   # 放即時狀態訊息的頻道；留空就用通知頻道
      # /start、/stop 要開關的 Minecraft VM
      GCP_ZONE: ${GCP_ZONE:-asia-east1-b}
      GCP_INSTANCE: ${GCP_INSTANCE:-minecraft-server}
      # 除了有「管理伺服器」權限的人，還有誰能用 /start、/stop（Discord ID，逗號分隔）
      CONTROL_ROLE_IDS: ${CONTROL_ROLE_IDS:-}
      CONTROL_USER_IDS: ${CONTROL_USER_IDS:-}
      POLL_SECONDS: "30"
    volumes:
      - ./bot.py:/app/bot.py:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
